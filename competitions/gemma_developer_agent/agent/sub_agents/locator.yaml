name: locator
role: "Bug Reproducer & Locator"
description: "Isolates defect root causes and inspects exact target line ranges."
prompt: "prompts/locator.md"
max_turns: 6
timeout_seconds: 120
allowed_tools:
  - read_file
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph
  - edit_file
  - write_file
  - run_command
  - get_status
  - submit_patch
