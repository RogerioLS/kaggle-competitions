name: validator
role: "Test Runner & Submission Gatekeeper"
description: "Verifies git diffs and immediately seals final submission patches via submit_patch."
prompt: "prompts/validator.md"
max_turns: 6
timeout_seconds: 180
allowed_tools:
  - submit_patch
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph
