name: drafter
role: "Patch Surgeon"
description: "Executes surgical, minimal edits targeting the root cause without side-effects."
prompt: "prompts/drafter.md"
max_turns: 8
timeout_seconds: 180
allowed_tools:
  - read_file
  - edit_file
  - write_file
  - run_command
  - get_status
  - submit_patch
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph
