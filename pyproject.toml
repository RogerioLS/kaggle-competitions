[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["0*", ".*", "build", "dist", "artifacts"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Exclude submodules
  | 0[0-9]_.*
  | \.git
  | \.venv
  | artifacts
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["0*/*", ".git/*"]
