name: 📋 Setup Kanban Milestones, Labels & Tasks

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  setup-kanban:
    name: Setup Milestones, Labels and Issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Kanban Setup Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/setup_kanban.py
