name: 📋 Setup Kanban Milestones, Labels & Tasks

on:
  push:
    branches:
      - main
    paths:
      - '.github/issues/**'
      - '.github/scripts/setup_kanban.py'
      - '.github/workflows/setup_tasks.yml'
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  setup-kanban:
    name: Setup Milestones, Labels and Issues
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install pyyaml

      - name: Run Kanban Setup Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/setup_kanban.py
