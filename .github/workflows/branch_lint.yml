name: 🌿 Branch Name & Task Format Quality Gate

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  branch_lint:
    name: Validate Branch & Task Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate Branch Name and Commits (Auto-Close on Failure)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 scripts/lint_branch_and_commits.py \
            --branch "${{ github.head_ref }}" \
            --base "${{ github.base_ref }}" \
            --pr-number "${{ github.event.pull_request.number }}"
