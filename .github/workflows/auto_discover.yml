name: 🤖 Auto-Discover & Register Competitions

on:
  schedule:
    - cron: "0 12 * * *" # Daily at 12:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (do not create branches or commit)"
        required: false
        default: false
        type: boolean
      auto_merge:
        description: "Automatically merge registration branch into main"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-discover:
    name: Discover & Register Kaggle Repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Hub Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.REPO_DISCOVERY_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Git User & Authentication
        env:
          AUTH_TOKEN: ${{ secrets.REPO_DISCOVERY_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${AUTH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Run Auto-Discovery Engine
        env:
          GH_TOKEN: ${{ secrets.REPO_DISCOVERY_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.REPO_DISCOVERY_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.auto_merge }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --auto-merge"
          fi
          
          python3 scripts/auto_discover_competitions.py $ARGS
