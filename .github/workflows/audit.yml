name: Full Quality Gate & Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  audit:
    name: Make Audit & Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate Audit Summary & Artifacts
        run: |
          python scripts/generate_summary.py
          cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: Comment Audit Summary on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.html_url }}" --body-file summary.md

      - name: Dynamically Update PR Title
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python scripts/rename_pr.py

      - name: Auto-Check Off PR Description Checklist
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python scripts/update_pr_checklist.py

      - name: Auto-Check Off & Close Linked Issue Upon Audit Pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python scripts/update_issue_checklist.py

      - name: Upload Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-chassis-audit-report
          path: |
            summary.md
            artifacts/

      - name: Enforce Strict Quality Gate (Fail if Audit Failed)
        run: |
          python -c "import json; m = json.load(open('artifacts/audit_summary.json')); exit(0 if m.get('overall_passed') else 1)"
