"area: core":
  - changed-files:
      - any-glob-to-any-file: "src/core/**"

"area: competition":
  - changed-files:
      - any-glob-to-any-file: "competitions/**"

"area: tests":
  - changed-files:
      - any-glob-to-any-file: "tests/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"
          - "Makefile"
          - "pyproject.toml"
