name: "🐛 Bug Report"
description: "File a bug or unexpected behavior in Clean Chassis."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report this issue!"
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "A clear description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to reproduce"
      description: "Steps to reproduce the behavior."
    validations:
      required: true
